{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Reset Complete | Deep INK</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            background: #f2f4f5;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-container {
            width: 100%;
            max-width: 520px;
            padding: 20px;
        }

        .success-card {
            background: white;
            border-radius: 16px;
            padding: 45px 40px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 120px;
            height: auto;
            margin-bottom: 25px;
        }

        .success-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #3c8f8f;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 34px;
        }

        h1 {
            color: #18384a;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .message {
            color: #5f6b72;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .login-button {
            display: inline-block;
            width: 100%;
            padding: 13px 20px;
            background: #18384a;
            color: white;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: 0.2s ease;
        }

            .login-button:hover {
                background: #3c8f8f;
                color: white;
            }

        .security-note {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e5e8ea;
            color: #7a858b;
            font-size: 13px;
        }

            .security-note i {
                margin-right: 5px;
                color: #3c8f8f;
            }

        @media (max-width: 576px) {

            .success-card {
                padding: 35px 25px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="success-container">

        <div class="success-card">

            <img src="{% static 'images/deep_ink_logo.png' %}"
                 alt="Deep INK Community Center Logo"
                 class="logo">

            <div class="success-icon">
                <i class="bi bi-check-lg"></i>
            </div>

            <h1>
                Password Reset Successful
            </h1>

            <p class="message">
                Your password has been successfully changed.
                You can now sign in to the Deep INK Staff Portal
                using your new password.
            </p>

            <a href="{% url 'login' %}"
               class="login-button">

                <i class="bi bi-box-arrow-in-right me-2"></i>
                Return to Staff Login

            </a>

            <div class="security-note">

                <i class="bi bi-shield-check"></i>

                Your account password has been securely updated.

            </div>

        </div>

    </div>

</body>
</html>
